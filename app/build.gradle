apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    compileSdk 36
    buildFeatures.buildConfig true


    defaultConfig {
        applicationId "org.pjsip.pjsua2.app"
        minSdkVersion 24
        targetSdkVersion 33
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
//            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
    flavorDimensions "version"
    productFlavors {
        demo {
            isDefault true
            dimension "version"
            buildConfigField "int", "SIP_PORT", "6000"
            buildConfigField "boolean", "IS_TEST", "false"
            buildConfigField "String", "TEST_TAG", "\"demo\""
        }
        ciTest {
            dimension "version"
            buildConfigField "int", "SIP_PORT", "6677"
            buildConfigField "boolean", "IS_TEST", "true"
            buildConfigField "String", "TEST_TAG", "\"ciTest\""
        }
    }
    namespace 'org.pjsip.pjsua2.app'
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    implementation project(path: ':pjsua2')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.test.espresso:espresso-idling-resource:3.7.0'
    implementation 'androidx.core:core-ktx:1.17.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-idling-resource:3.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.ext:junit-ktx:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    testImplementation 'junit:junit:4.13.2'
    implementation(project(":androidsoftphonesdk"))
}
